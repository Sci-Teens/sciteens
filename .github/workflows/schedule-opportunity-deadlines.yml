name: Schedule Opportunity Deadlines

on:
  schedule:
    - cron: '0 10 * * 1'
  workflow_dispatch:

concurrency:
  group: schedule-opportunity-deadlines
  cancel-in-progress: false

jobs:
  schedule:
    runs-on: ubuntu-latest
    environment: social-posts
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - id: auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SCRAPER_SA }}

      - name: Schedule deadline carousels
        run: node scripts/schedule-opportunity-deadlines.js --project "$GCP_PROJECT_ID" --execute
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_INSTAGRAM_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
          BUFFER_FACEBOOK_CHANNEL_ID: ${{ secrets.BUFFER_FACEBOOK_CHANNEL_ID }}
          BUFFER_ORGANIZATION_NAME: ${{ vars.BUFFER_ORGANIZATION_NAME }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          SITE_URL: ${{ vars.SITE_URL }}
