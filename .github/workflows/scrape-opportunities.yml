name: Scrape Opportunities

on:
  schedule:
    # Every Monday 06:00 UTC. Manual runs (workflow_dispatch below) are the
    # normal way to test this without waiting for the schedule.
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: scrape-opportunities
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.OPPORTUNITIES_GCP_SA_KEY }}

      - name: Run scraper
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/scrapeOpportunities.js --project ${{ vars.FIREBASE_PROJECT_ID }}
