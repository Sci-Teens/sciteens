name: Scrape Opportunities

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: scrape-opportunities
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: directed-relic-266701
          workload_identity_provider: projects/872009864607/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: opportunities-scraper@directed-relic-266701.iam.gserviceaccount.com

      - name: Run scraper
        run: node scripts/scrapeOpportunities.js --project directed-relic-266701
