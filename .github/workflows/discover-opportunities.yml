name: Discover Opportunity Sources

on:
  workflow_dispatch:
    inputs:
      scope:
        description: 'Discovery query set'
        type: choice
        options:
          - existing
          - us
        default: existing
      jurisdiction:
        description: 'U.S. code, for example MT, PR, or US. Blank selects all jurisdictions.'
        type: string
        default: ''
      track:
        description: 'Optional U.S. track. Blank selects the six primary tracks.'
        type: string
        default: ''
      query_offset:
        description: 'Starting query offset within the selected query set'
        type: string
        default: '0'
      query_limit:
        description: 'Maximum queries. Blank uses six U.S. queries or all existing queries.'
        type: string
        default: ''
      execute:
        description: 'Write discovery results to Firestore. Leave unchecked for a dry run.'
        type: boolean
        default: false

concurrency:
  group: discover-opportunities
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    environment: scrape-opportunities
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - id: auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SCRAPER_SA }}

      - name: Discover new opportunity sources
        shell: bash
        run: |
          args=(--project "$GCP_PROJECT_ID" --query-offset "$QUERY_OFFSET")
          if [[ -n "$QUERY_LIMIT" ]]; then
            args+=(--query-limit "$QUERY_LIMIT")
          fi
          if [[ "$DISCOVERY_SCOPE" == "us" ]]; then
            args+=(--us)
          fi
          if [[ -n "$JURISDICTION" ]]; then
            args+=(--jurisdiction "$JURISDICTION")
          fi
          if [[ -n "$TRACK" ]]; then
            args+=(--track "$TRACK")
          fi
          if [[ "$EXECUTE" == "true" ]]; then
            args+=(--execute)
          fi
          node scripts/discoverOpportunitySources.js "${args[@]}"
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          DISCOVERY_SCOPE: ${{ inputs.scope }}
          JURISDICTION: ${{ inputs.jurisdiction }}
          TRACK: ${{ inputs.track }}
          QUERY_OFFSET: ${{ inputs.query_offset }}
          QUERY_LIMIT: ${{ inputs.query_limit }}
          EXECUTE: ${{ inputs.execute }}
