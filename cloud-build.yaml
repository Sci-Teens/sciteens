# One-time IAM setup, before the first build of a new project. The Cloud Build
# service account (<project-number>@cloudbuild.gserviceaccount.com) needs both
# Firebase roles below; firebase-tools picks that identity up from the ambient
# Application Default Credentials. Every Firebase predefined role also carries
# firebase.projects.get, which is what lets the CLI resolve --project.
#
#   PROJECT=<project-id>
#   NUMBER=$(gcloud projects describe "$PROJECT" --format='value(projectNumber)')
#   for ROLE in roles/firebaserules.admin roles/firebasehosting.admin; do
#     gcloud projects add-iam-policy-binding "$PROJECT" \
#       --member="serviceAccount:${NUMBER}@cloudbuild.gserviceaccount.com" \
#       --role="$ROLE"
#   done
#
# Miss firebasehosting.admin and every build still deploys Cloud Run, then
# fails on the last step with "Failed to get Firebase project".
#
# Rules deploy first: app code merged alongside a rules change must never
# ship before the rules are live. Idempotent — a no-op if unchanged.

steps:
  - name: 'node:24-alpine'
    entrypoint: npx
    args:
      [
        'firebase-tools@15.23.0',
        'deploy',
        '--only',
        'firestore:rules,storage',
        '--project',
        '${_NEXT_PUBLIC_FB_PROJECT_ID}',
        '--non-interactive',
      ]
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        docker pull gcr.io/${_NEXT_PUBLIC_FB_PROJECT_ID}/website:latest || exit 0
  - name: gcr.io/cloud-builders/docker
    timeout: 1200s
    args:
      [
        'build',
        '-f',
        'Dockerfile',
        '-t',
        'gcr.io/${_NEXT_PUBLIC_FB_PROJECT_ID}/website',
        '--cache-from',
        'gcr.io/${_NEXT_PUBLIC_FB_PROJECT_ID}/website:latest',
        '.',
        '--build-arg',
        'NODE_ENV=${_NODE_ENV}',
        '--build-arg',
        'NEXT_PUBLIC_FB_PROJECT_ID=${_NEXT_PUBLIC_FB_PROJECT_ID}',
        '--build-arg',
        'NEXT_PUBLIC_FB_AUTH_DOMAIN=${_NEXT_PUBLIC_FB_AUTH_DOMAIN}',
        '--build-arg',
        'NEXT_PUBLIC_FB_API_KEY=${_NEXT_PUBLIC_FB_API_KEY}',
        '--build-arg',
        'NEXT_PUBLIC_FB_MESSAGING_SENDER_ID=${_NEXT_PUBLIC_FB_MESSAGING_SENDER_ID}',
        '--build-arg',
        'NEXT_PUBLIC_FB_APP_ID=${_NEXT_PUBLIC_FB_APP_ID}',
        '--build-arg',
        'NEXT_PUBLIC_FB_MEASUREMENT_ID=${_NEXT_PUBLIC_FB_MEASUREMENT_ID}',
      ]
  - name: 'gcr.io/cloud-builders/docker'
    args:
      [
        'push',
        'gcr.io/${_NEXT_PUBLIC_FB_PROJECT_ID}/website',
      ]
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      [
        'run',
        'deploy',
        'website',
        '--image',
        'gcr.io/${_NEXT_PUBLIC_FB_PROJECT_ID}/website',
        '--region',
        'us-east1',
        '--platform',
        'managed',
        '--port',
        '3000',
        '--memory',
        '1Gi',
        '--cpu',
        '1',
        '--min-instances',
        '0',
        '--max-instances',
        '10',
        '--concurrency',
        '80',
        '--timeout',
        '300',
        '--set-env-vars',
        'MEILI_HOST=${_MEILI_HOST}',
        '--set-secrets',
        'MEILI_SEARCH_KEY=meilisearch-search-key:latest',
        '--allow-unauthenticated',
      ]
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      [
        'run',
        'services',
        'update-traffic',
        'website',
        '--to-latest',
        '--platform',
        'managed',
        '--region',
        'us-east1',
      ]
  # Last, because the `**` rewrite needs the Cloud Run revision already live.
  # Needs roles/firebasehosting.admin. See infra/hosting/README.md.
  - name: 'node:24-alpine'
    entrypoint: npx
    args:
      [
        'firebase-tools@15.23.0',
        'deploy',
        '--only',
        'hosting',
        '--project',
        '${_NEXT_PUBLIC_FB_PROJECT_ID}',
        '--non-interactive',
      ]
timeout: 1200s
images:
  - gcr.io/${_NEXT_PUBLIC_FB_PROJECT_ID}/website
