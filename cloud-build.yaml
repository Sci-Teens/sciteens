# Complete the one-time IAM setup in infra/hosting/README.md before the first
# build. Grant roles/firebaserules.admin and roles/firebasehosting.admin to
# the Cloud Build service account. Firebase Hosting does not support custom
# IAM roles for version and release deployment.
#
# Rules deploy first: app code merged alongside a rules change must never
# ship before the rules are live. Idempotent — a no-op if unchanged.

serviceAccount: projects/directed-relic-266701/serviceAccounts/website-build@directed-relic-266701.iam.gserviceaccount.com

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - name: 'node:24-alpine@sha256:e67514e5d0f6c46656005e1b693b2ec9d52e80b641307de684d4a015ba7a4eaf'
    entrypoint: npx
    args:
      [
        'firebase-tools@15.23.0',
        'deploy',
        '--only',
        'firestore:rules,storage',
        '--project',
        '${_NEXT_PUBLIC_FB_PROJECT_ID}',
        '--non-interactive',
      ]
  - name: 'gcr.io/cloud-builders/docker@sha256:3d00b6c1a9b862621c30fc74d4f2abfc62bcbdee631ed3febd31e7edbdf6252c'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        docker pull gcr.io/${_NEXT_PUBLIC_FB_PROJECT_ID}/website:latest || exit 0
  - name: 'gcr.io/cloud-builders/docker@sha256:3d00b6c1a9b862621c30fc74d4f2abfc62bcbdee631ed3febd31e7edbdf6252c'
    timeout: 1200s
    args:
      [
        'build',
        '-f',
        'Dockerfile',
        '-t',
        'gcr.io/${_NEXT_PUBLIC_FB_PROJECT_ID}/website',
        '--cache-from',
        'gcr.io/${_NEXT_PUBLIC_FB_PROJECT_ID}/website:latest',
        '.',
        '--build-arg',
        'NODE_ENV=${_NODE_ENV}',
        '--build-arg',
        'NEXT_PUBLIC_FB_PROJECT_ID=${_NEXT_PUBLIC_FB_PROJECT_ID}',
        '--build-arg',
        'NEXT_PUBLIC_FB_AUTH_DOMAIN=${_NEXT_PUBLIC_FB_AUTH_DOMAIN}',
        '--build-arg',
        'NEXT_PUBLIC_FB_API_KEY=${_NEXT_PUBLIC_FB_API_KEY}',
        '--build-arg',
        'NEXT_PUBLIC_FB_MESSAGING_SENDER_ID=${_NEXT_PUBLIC_FB_MESSAGING_SENDER_ID}',
        '--build-arg',
        'NEXT_PUBLIC_FB_APP_ID=${_NEXT_PUBLIC_FB_APP_ID}',
        '--build-arg',
        'NEXT_PUBLIC_FB_MEASUREMENT_ID=${_NEXT_PUBLIC_FB_MEASUREMENT_ID}',
      ]
  - name: 'gcr.io/cloud-builders/docker@sha256:3d00b6c1a9b862621c30fc74d4f2abfc62bcbdee631ed3febd31e7edbdf6252c'
    args:
      [
        'push',
        'gcr.io/${_NEXT_PUBLIC_FB_PROJECT_ID}/website',
      ]
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim@sha256:df30191e2435b838d0d6e07c228ced843829703c9f966c0163175bad88b291be'
    entrypoint: gcloud
    args:
      [
        'run',
        'deploy',
        'website',
        '--image',
        'gcr.io/${_NEXT_PUBLIC_FB_PROJECT_ID}/website',
        '--region',
        'us-east1',
        '--platform',
        'managed',
        '--port',
        '3000',
        '--memory',
        '1Gi',
        '--cpu',
        '1',
        '--min-instances',
        '0',
        '--max-instances',
        '10',
        '--concurrency',
        '80',
        '--timeout',
        '300',
        '--set-env-vars',
        'MEILI_HOST=${_MEILI_HOST}',
        '--set-secrets',
        'MEILI_SEARCH_KEY=meilisearch-search-key:latest',
        '--allow-unauthenticated',
      ]
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim@sha256:df30191e2435b838d0d6e07c228ced843829703c9f966c0163175bad88b291be'
    entrypoint: gcloud
    args:
      [
        'run',
        'services',
        'update-traffic',
        'website',
        '--to-latest',
        '--platform',
        'managed',
        '--region',
        'us-east1',
      ]
  # Last, because the `**` rewrite needs the Cloud Run revision already live.
  # See infra/hosting/README.md.
  - name: 'node:24-alpine@sha256:e67514e5d0f6c46656005e1b693b2ec9d52e80b641307de684d4a015ba7a4eaf'
    entrypoint: npx
    args:
      [
        'firebase-tools@15.23.0',
        'deploy',
        '--only',
        'hosting',
        '--project',
        '${_NEXT_PUBLIC_FB_PROJECT_ID}',
        '--non-interactive',
      ]
timeout: 1200s
images:
  - gcr.io/${_NEXT_PUBLIC_FB_PROJECT_ID}/website
